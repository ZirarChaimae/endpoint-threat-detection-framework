title: Scheduled Task Creation via schtasks.exe
id: 3c9d7e21-1a4f-4c88-9e2b-5d6f8a0c1b23
status: experimental
description: Detects creation of a new scheduled task via schtasks.exe, commonly used for persistence.
author: Zirar Chaimae
date: 2026/08/19
references:
    - https://attack.mitre.org/techniques/T1053/005/
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Legitimate IT automation or scheduled maintenance tasks
level: medium
tags:
    - attack.persistence
    - attack.t1053.005