title: File Extensions Hidden via Registry Modification
id: 0b1c2d3e-4f5a-4678-8e9f-0a1b2c3d4e5f
status: experimental
description: Detects modification of the HideFileExt registry value, which hides file extensions in Explorer — a known technique for disguising malicious files (e.g. invoice.pdf.exe appearing as invoice.pdf).
author: Zirar Chaimae
date: 2026/08/17
references:
    - https://attack.mitre.org/techniques/T1112/
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Explorer\Advanced\HideFileExt'
        Details: 'DWORD (0x00000001)'
    condition: selection
falsepositives:
    - A user manually toggling this setting via Folder Options (rare, but legitimate)
level: medium
tags:
    - attack.t1112