title: Multiple Failed Logon Attempts (Bad Password)
id: 1a2b3c4d-5e6f-4789-8a9b-0c1d2e3f4a5b
status: experimental
description: Detects failed logon attempts due to incorrect username or password (Event ID 4625, Status 0xC000006D), consistent with manual credential-guessing or basic brute-force attempts.
author: Zirar Chaimae
date: 2026/08/30
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        Status: '0xC000006D'
    condition: selection
falsepositives:
    - Legitimate user mistyping their password
level: low
tags:
    - attack.t1110